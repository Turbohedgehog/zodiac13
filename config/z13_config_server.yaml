# Copied to bin/config/ on build, read from next to the executable at startup.
# Used instead of z13_config.yaml when launched with --server or --headless: no raylib_module,
# since a dedicated server and a headless client have no window/GUI/render.

modules:
  - modules/z13_module/z13_module
  - modules/building_module/building_module
  - modules/bullet_module/bullet_module
  - modules/station_module/station_module
  - modules/conduit_module/conduit_module
  - modules/power_module/power_module
  - modules/net_module/net_module
  - modules/test_dll/test_dll_module
