name: PR Tests

on:
  pull_request:
    branches: [ main ]
  # A PR can't read another PR's caches, only main's, so main keeps the compiler cache warm.
  push:
    branches: [ main ]

concurrency:
  group: pr-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triplet: x64-windows
            compiler-cache: sccache # ccache can't wrap MSVC
          - os: ubuntu-24.04
            triplet: x64-linux
            compiler-cache: ccache
          - os: ubuntu-24.04-arm
            triplet: arm64-linux
            cache-suffix: -arm64-linux
            compiler-cache: ccache
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      VCPKG_ROOT: ""
      VCPKG_BUILD_TYPE: release # only build Release vcpkg deps (shares cache_update.yml cache)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # cl on PATH, so Windows builds with Ninja: the VS generator ignores compiler launchers.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.triplet }}
          variant: ${{ matrix.compiler-cache }}
          max-size: 2G

      - uses: ./.github/actions/setup-vcpkg-build
        with:
          triplet: ${{ matrix.triplet }}
          cache-suffix: ${{ matrix.cache-suffix }}
          extra-cmake-args: >-
            -G Ninja
            -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.compiler-cache }}
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.compiler-cache }}

      # Plus the server plugins, which the tests (static twins) never link; z13_plugin_smoke loads them. Not raylib / the app.
      - name: Build tests
        run: cmake --build build --target z13_test_runner z13_plugin_smoke

      # Every test is its own process (gtest_discover_tests), so they run side by side.
      - name: Run tests
        env:
          Z13_STATE_DUMP: ${{ github.workspace }}/state-dump.txt
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 4

      # The release packages are Linux-only (Windows zips bin/), so only they are checked.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target zodiac13
          cd build && cpack -G "TGZ;DEB"

      - name: Run the server from the package (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/package_smoke.sh build/zodiac13-*.tar.gz

      - name: Install the .deb and run the server (Linux)
        if: runner.os == 'Linux'
        run: .github/scripts/deb_smoke.sh build/zodiac13-*.deb

      # CrossPlatformStateTest's dump; the cross-platform-state job compares them.
      - name: Upload state dump
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: state-dump-${{ matrix.triplet }}
          path: state-dump.txt
          if-no-files-found: error

  cross-platform-state:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: state-dump-*
          path: dumps

      # Lines are "tick, entity, component, value": the first diff line is where they diverged.
      - name: Compare state dumps
        shell: bash
        run: |
          reference=dumps/state-dump-x64-linux/state-dump.txt
          status=0
          dumps=(dumps/*/state-dump.txt)
          if [ "${#dumps[@]}" -ne 3 ]; then
            echo "::error::expected a dump from each of the 3 platforms, got ${#dumps[@]}"
            status=1
          fi
          for dump in "${dumps[@]}"; do
            if ! cmp -s "$reference" "$dump"; then
              echo "::error::$dump differs from $reference"
              diff "$reference" "$dump" | head -20 || true  # bash -e -o pipefail would stop here
              status=1
            fi
          done
          exit $status
