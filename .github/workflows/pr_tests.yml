name: PR Tests

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triplet: x64-windows
          - os: ubuntu-24.04
            triplet: x64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      VCPKG_ROOT: ""
      VCPKG_BUILD_TYPE: release # only build Release vcpkg deps (shares cache_update.yml cache)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-vcpkg-build
        with:
          triplet: ${{ matrix.triplet }}

      # Only the test runner and its deps (lib_core, gtest, reflectcpp) — not raylib / the app.
      - name: Build tests
        run: cmake --build build --config Release --target z13_test_runner

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --no-tests=error
