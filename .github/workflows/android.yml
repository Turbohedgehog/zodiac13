name: Android

on:
  pull_request:
    branches: [ main ]
  # main keeps the caches warm for PRs; the Android plan's branches get an APK before their PR.
  push:
    branches: [ main, 'f/android-*', 'f/touch-*' ]
  workflow_dispatch:
  # build_release.yml adds the APK to its release.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

concurrency:
  # The caller's name when called, so a release doesn't cancel main's own run.
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # the releases; nothing else writes

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      VCPKG_ROOT: ""
      VCPKG_BUILD_TYPE: release
      TRIPLET: arm64-android

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # the commit count is the versionCode

      # main's commit count up to the merge base is the patch and versionCode of every build of a
      # commit (build_release.yml too). Not HEAD's: a squash merge folds a PR's commits into one, and
      # main's next APK would be refused as a downgrade. A PR or branch build gets a suffix.
      - name: Read the version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE: ${{ inputs.release }}
        run: |
          VERSION_CODE=$(git rev-list --count "$(git merge-base HEAD origin/main)")
          if [ -n "$PR_NUMBER" ]; then
            SUFFIX="-pr$PR_NUMBER"
          elif [ "$RELEASE" = "true" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            SUFFIX=""
          else
            SUFFIX="-${GITHUB_REF_NAME//\//-}"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(tr -d '[:space:]' < version.txt).$VERSION_CODE$SUFFIX" >> "$GITHUB_ENV"

      # vcpkg's Android toolchain reads ANDROID_NDK_HOME; the image's default NDK is older.
      - name: Select the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: arm64-android
          max-size: 2G

      - uses: ./.github/actions/setup-vcpkg-build
        with:
          triplet: arm64-android
          cache-suffix: -arm64-android
          extra-cmake-args: >-
            -G Ninja
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
            -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM=android-26
            -DANDROID_STL=c++_shared
            -DZ13_VERSION_PATCH=${{ env.VERSION_CODE }}
            -DZ13_VERSION_SUFFIX=${{ env.VERSION_SUFFIX }}
            -DZ13_PROFILE=${{ inputs.release && 'OFF' || 'ON' }}
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build and stage the libraries
        run: |
          set -o pipefail
          cmake --build build --target z13_android_stage --parallel 4 2>&1 | tee build-android.log

      # vcpkg's sdl3 port doesn't install SDLActivity's Java sources: take them from the same release.
      - name: Fetch SDL's Java sources
        run: |
          version=$(sed -n 's/^set(PACKAGE_VERSION "\(.*\)")$/\1/p' "vcpkg_installed/$TRIPLET/share/sdl3/SDL3ConfigVersion.cmake")
          echo "SDL3 $version"
          mkdir -p sdl
          curl -sSfL "https://github.com/libsdl-org/SDL/archive/refs/tags/release-$version.tar.gz" \
            | tar xz -C sdl --strip-components=1 "SDL-release-$version/android-project/app/src/main/java"
          echo "SDL_JAVA_DIR=$PWD/sdl/android-project/app/src/main/java" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug \
            -Pz13StageDir="$PWD/build/android" -Pz13SdlJavaDir="$SDL_JAVA_DIR" \
            -Pz13VersionCode="$VERSION_CODE" -Pz13VersionName="$VERSION_NAME" 2>&1 | tee gradle.log
          mkdir -p apk
          mv android/app/build/outputs/apk/debug/app-debug.apk "apk/zodiac13-$VERSION_NAME-android-arm64.apk"

      # What the APK's size is made of, readable without a token (check-runs/<id>/annotations).
      - name: Report the APK's largest files
        run: |
          largest=$(unzip -l apk/*.apk | sort -k1 -n -r | head -n 25 | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=APK contents::$largest"

      # The APK itself (an archive already), named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: apk/zodiac13-${{ env.VERSION_NAME }}-android-arm64.apk
          archive: false
          if-no-files-found: error

      # A fixed file name, so the link .../releases/download/android-latest/zodiac13-android-arm64.apk stays.
      - name: Publish as android-latest (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apk/*.apk zodiac13-android-arm64.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest zodiac13-android-arm64.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android $VERSION_NAME (latest main)" --notes "Debug APK of $GITHUB_SHA, version $VERSION_NAME."

      - name: Add to the release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          tag_name: v${{ env.VERSION_NAME }}
          name: "Release v${{ env.VERSION_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Annotate the failure
        if: failure()
        run: >-
          .github/scripts/annotate_failure.sh
          build/vcpkg-manifest-install.log build-android.log gradle.log
          'vcpkg/buildtrees/*/*-err.log' 'vcpkg/buildtrees/*/*-out.log'
