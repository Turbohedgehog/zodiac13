name: Update vcpkg Cache (Cron)

on:
  schedule:
    - cron: '0 3 * * 0,3'
  workflow_dispatch: # Позволяет запустить обновление вручную

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      VCPKG_ROOT: ""
      VCPKG_BUILD_TYPE: release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: false